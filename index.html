</style></head><body><header><nav><a class="brand" href="#" aria-label="На главную"><b>1С</b><span>Тема 1. От Python к Элементу</span></a><div class="links"><a class="launch" href="https://lang.1c.ru/" target="_blank" rel="noopener noreferrer">Открыть среду 1С ↗</a></div></nav></header><main><div class="layout"><aside class="sidebar"><div class="eyebrow">Ваш маршрут</div><div class="progress"><div id="progressBar"></div></div><p id="progressText" class="small muted"></p><div class="lesson-nav" id="lessonNav" aria-label="Шаги занятия"></div><div class="sticky-help"><b>Учебник + онлайн-среда</b><p class="small">Читайте объяснение здесь, а код пишите и запускайте в отдельной вкладке 1С.</p><a href="https://1cmycloud.com/console/play" target="_blank" rel="noopener noreferrer">Открыть среду разработки ↗</a></div></aside><article class="lesson-content" id="lesson" aria-label="Текущий шаг"></article></div></main><footer>Учебный практикум «От Python к 1С:Элемент» · <a href="admin.html">Вход преподавателя</a></footer><script src="config.js"></script><script src="api.js"></script><script src="questions.js"></script><script src="quiz.js"></script><script>const lessons=[{"title": "Что такое 1С:Элемент", "theory": "Знакомство с 1С:Элемент начнём со сравнения с Python: основы этого языка уже знакомы многим из вас. Будем опираться на известные понятия — переменные, ввод и вывод данных, арифметические операции — и разбирать, как те же действия записываются в 1С:Элемент. Так вы сможете переносить знакомые алгоритмы на новый язык и лучше понимать его синтаксис.\n\n1С:Элемент — язык программирования, на котором описывают данные и действия над ними. Он используется в технологиях 1С:Предприятие.Элемент. На первых шагах мы изучаем язык на небольших консольных программах: они получают данные, выполняют вычисления и выводят текст. Это позволяет сосредоточиться на алгоритме, прежде чем переходить к интерфейсам и большим приложениям.", "code": "метод Скрипт()\n    Консоль.Записать(\"Среда готова!\")\n;", "python": "print(\"Среда готова!\")", "task": "Откройте онлайн-среду кнопкой ниже и найдите редактор кода и область вывода. Если показан стартовый экран, нажмите «Запустить Среду разработки». Введите пример в редакторе скрипта и выполните запуск. Затем замените сообщение на «Я начинаю изучать 1С:Элемент» и запустите ещё раз. Сохраните копию своего кода в текстовый файл.", "expected": "Я начинаю изучать 1С:Элемент", "hint": "Выполните именно скрипт с методом «Скрипт()». Если среда ещё подготавливается, дождитесь её загрузки. Не вставляйте код в строку поиска или в область вывода.", "check": "Чем язык отличается от среды разработки?", "options": ["Язык задаёт правила записи программы, среда помогает её написать и запустить", "Это два названия одного окна браузера", "Язык нужен только для оформления текста"], "answer": 0, "explain": "Язык определяет синтаксис и смысл конструкций; редактор, запуск и сообщения об ошибках относятся к среде.", "sections": [{"title": "Язык, среда и программа", "text": "Язык — набор правил, по которым записывают команды. Среда разработки — инструменты для редактирования и запуска. Программа — конкретный текст на языке, решающий задачу. Браузерная среда открывается отдельно: наш сайт объясняет материал, а код выполняется в 1С."}, {"title": "Что переносится из Python", "text": "Из Python вы уже знаете, как разбить задачу на шаги, выбрать исходные данные и проверить результат. Эти навыки пригодятся и в 1С:Элемент: знакомый алгоритм не нужно придумывать заново — нужно научиться записывать его другими конструкциями. Например, вывод через «print()» заменяется вызовом «Консоль.Записать()», а перед первым использованием переменной появляется «пер». Сначала объясните решение обычными словами, затем найдите соответствующие команды нового языка. Сравнивайте не только внешний вид кода, но и смысл каждой строки: какие данные она получает, что вычисляет и что выводит. Такой подход помогает понимать программу, а не запоминать готовый перевод."}, {"title": "Где используется 1С:Элемент в реальных организациях", "text": "На технологиях «1С:Предприятие.Элемент» создают прикладные решения для работы с клиентами, заказами и внутренними документами. В ООО «СМАРТ Автоматизация» внедрён B2B-портал для дилеров: подбор товаров, оформление заказов и просмотр состояний доставки с обменом данными с «1С:ERP». В KOBLIK GROUP приложение на «1С:Элемент» используется для согласования документов. Это примеры того, как программный код становится инструментом конкретного бизнес-процесса. Сведения приведены по описаниям участников на официальном сайте «1С:Проект года».", "links": [{"label": "Проект «СМАРТ Автоматизация»", "url": "https://eawards.1c.ru/projects/cifrovizaciya-na-platforme-1s-predpriyatieelement--b2b-portal-dlya-dilerskoy-seti-promyshlennogo-distribyutora-414202/"}, {"label": "Проект KOBLIK GROUP", "url": "https://eawards.1c.ru/projects/avtomatizaciya-soglasovaniya-vnutriholdingovyh-operaciy-s-pomoschyu-mobilnogo-prilozheniya-napisannogo-na-1s-element-395039/"}]}, {"title": "2. Сквозной проект «Автоматизация компьютерного магазина»", "text": "Вы — разработчик программы для продавца компьютерного магазина «КомпьютерПлюс». Сначала программа показывает сведения о магазине и товаре. Затем вы добавите переменные, расчёт стоимости, ввод данных покупателя и оформление заказа. В конце программа рассчитает два заказа и их общую сумму. Развивайте один файл «КомпьютерныйМагазин.sbsl», а перед каждым этапом сохраняйте его предыдущую версию.", "headingLevel": 3}, {"title": "Что подготовить к занятию", "text": "Откройте официальный сайт https://lang.1c.ru/. Выберите удобный вариант: скачать дистрибутив «1С:Предприятие.Элемент Скрипт», установить его и работать локально или запустить среду разработки в браузере. Для браузерного варианта используйте кнопку ниже. Оставьте учебник и редактор в двух вкладках или соседних окнах. Вводить и запускать код мы начнём со следующего шага."}, {"title": "Что такое файл .sbsl", "text": "Расширение .sbsl обозначает файл исходного кода скрипта 1С:Элемент. Это текст программы: определения методов, инструкции и комментарии. Например, файл КомпьютерныйМагазин.sbsl можно открыть в редакторе, изменить и запустить через соответствующую среду. Само переименование обычного файла в .sbsl не делает его программу правильной. В установленной среде сохраняйте скрипты с этим расширением; при работе в браузере отдельно сохраняйте копии кода, чтобы не потерять выполненные задания."}], "mini": "До запуска объясните, что в примере является командой, а что — сообщением. После изменения текста сравните результаты двух запусков.", "source": "М. Г. Радченко, «1С:ЭЛЕМЕНТарно!», гл. 1–2 и 4, с. 20–26. Пояснения и задания адаптированы для практикума."}, {"title": "Каркас программы", "theory": "Ключевое слово «метод» начинает определение метода. «Скрипт» — имя метода, который среда по умолчанию вызывает при запуске скрипта. Скобки «()» обозначают список параметров: пока он пуст. Команды размещаем внутри метода с отступом для читаемости. Символ «;» на отдельной строке закрывает определение метода: после каждой команды он не требуется.", "code": "метод Скрипт()\n    Консоль.Записать(\"КомпьютерПлюс\")\n    Консоль.Записать(\"Оформление заказов\")\n;", "python": "print(\"КомпьютерПлюс\")\nprint(\"Оформление заказов\")", "task": "В среде разработки создайте файл «КомпьютерныйМагазин.sbsl» или новый скрипт с таким названием. Введите пример и запустите его. Затем добавьте третье сообщение: «Продавец: Иван». Сохраните этот файл: на следующих этапах вы будете дополнять его, а не создавать отдельные программы.", "expected": "КомпьютерПлюс\nОформление заказов\nПродавец: Иван", "hint": "Все команды вывода расположите внутри «метод Скрипт()», до закрывающего символа «;».", "check": "Что закрывает символ «;» в приведённом примере?", "options": ["Каждую строку текста", "Определение метода", "Только строку с комментарием"], "answer": 1, "explain": "В этом примере ; завершает определение метода «Скрипт()».", "sections": [{"title": "Инструкция и порядок выполнения", "text": "Инструкция — отдельное действие программы. Внутри метода инструкции выполняются последовательно, сверху вниз. Простую инструкцию записывают с новой строки. Точка с запятой в наших примерах закрывает определение метода, а не каждую команду."}, {"title": "Как читать запись метода", "text": "В строке «метод Скрипт()» слово «метод» начинает определение, «Скрипт» — имя, а «()» — пустой список параметров. В учебном скрипте это входной метод. Отступы показывают вложенность человеку: сохраняйте их, чтобы видеть границы тела метода."}], "mini": "До запуска запишите порядок трёх сообщений. Затем поменяйте местами сообщения о продавце и об оформлении заказов. Объясните, почему изменился порядок вывода.", "source": "М. Г. Радченко, «1С:ЭЛЕМЕНТарно!», гл. 4, с. 20–43. Пояснения и задания адаптированы для практикума.", "project": "Этап 1. Рабочий скрипт магазина"}, {"title": "Вывод информации", "theory": "«Консоль» — объект для общения с пользователем через консоль. Через точку обращаемся к методу «Записать()». В скобках передаём значение для вывода. Текст заключаем в двойные кавычки. Комментарий начинается с // и продолжается до конца строки: он поясняет программу и не выполняется.", "code": "метод Скрипт()\n    // Сведения о магазине\n    Консоль.Записать(\"КомпьютерПлюс\")\n    // Карточка товара\n    Консоль.Записать(\"Товар: Клавиатура\")\n;", "python": "# Сведения о магазине\nprint(\"КомпьютерПлюс\")\n# Карточка товара\nprint(\"Товар: Клавиатура\")", "task": "Продолжите скрипт магазина: после приветствия выведите карточку товара из семи строк. Укажите заголовок «Карточка товара», артикул KB-101, товар «Клавиатура», категорию «Периферия», цену 1500 руб., остаток 12 шт. и продавца Ивана. Добавьте подписи к данным и два комментария: перед сведениями о магазине и перед карточкой товара. Каждую строку выводите отдельной командой. Комментарии не должны появляться в результате.", "expected": "Карточка товара\nАртикул: KB-101\nТовар: Клавиатура\nКатегория: Периферия\nЦена: 1500 руб.\nОстаток: 12 шт.\nПродавец: Иван", "hint": null, "check": "Какая строка является комментарием?", "options": ["// Карточка товара", "# Карточка товара", "«Карточка товара»"], "answer": 0, "explain": "В 1С:Элемент однострочный комментарий начинается с //.", "sections": [{"title": "Литерал и вызов метода", "text": "Литерал — значение, записанное непосредственно в коде: например, «Привет» или 18. В «Консоль.Записать(«Привет»)» через точку обращаются к методу «Записать», а в скобках передают ему значение. Текст в двойных кавычках относится к типу «Строка»."}, {"title": "Комментарии и ошибки", "text": "После // до конца строки находится комментарий: он объясняет намерение автора и не выполняется. Подсветка синтаксиса помогает различать части записи, но сама по себе не гарантирует правильность. При ошибке сначала прочитайте сообщение и проверьте кавычки, скобки и имя метода."}], "mini": "Добавьте срок гарантии 12 месяцев и строку «Выдача: отдел периферии». Отделите карточку от приветствия пустой строкой. Перед запуском посчитайте строки всей программы, включая пустую.", "source": "М. Г. Радченко, «1С:ЭЛЕМЕНТарно!», гл. 4, с. 20–43. Пояснения и задания адаптированы для практикума.", "project": "Этап 2. Карточка товара для покупателя"}, {"title": "Переменные", "theory": "Переменная хранит значение, доступное по имени. Локальную переменную объявляют через «пер». В нашем магазине переменные будут хранить артикул, название товара, цену и остаток. Для вывода значения в строке используется подстановка «${...}». Теперь изменить цену можно в одном месте, а не искать её во всех сообщениях.", "code": "метод Скрипт()\n    пер Товар = \"Клавиатура\"\n    пер Цена = 1500\n    Консоль.Записать(\"Товар: ${Товар}\")\n    Консоль.Записать(\"Цена: ${Цена} руб.\")\n;", "python": "product = \"Клавиатура\"\nprice = 1500\nprint(f\"Товар: {product}\")\nprint(f\"Цена: {price} руб.\")", "task": "В том же скрипте замените значения карточки переменными: «Артикул», «Товар», «Категория», «Цена», «Остаток» и «Продавец». Сохраните заголовок магазина и карточку. Выводите значения переменных с подписями. Затем измените только начальные значения на мышь MS-202, цену 800 и остаток 20: карточка должна обновиться без редактирования команд вывода.", "expected": "Артикул: MS-202\nТовар: Мышь\nКатегория: Периферия\nЦена: 800 руб.\nОстаток: 20 шт.\nПродавец: Иван", "hint": "Объявляйте каждую переменную отдельно. В строках вывода используйте подстановки по имени переменной; не заменяйте их готовыми значениями.", "check": "Какая запись объявляет переменную цены?", "options": ["Цена := 1500", "let Цена = 1500", "пер Цена = 1500"], "answer": 2, "explain": "Слово «пер» объявляет локальную переменную, а = присваивает начальное значение.", "sections": [{"title": "Объявление и присваивание", "text": "«пер Цена = 1500» создаёт переменную с начальным значением. «Цена = 800» меняет значение уже объявленной переменной. Сначала вычисляется правая часть присваивания, затем результат записывается в переменную слева."}, {"title": "Имена, типы и подстановки", "text": "Выбирайте имена по смыслу: «Товар», «Цена», «Остаток». Тип можно указать явно, например «пер Цена: Число = 1500». Подстановка «${Цена}» вставляет значение переменной в текст. Сами кавычки строкового литерала в окне кода должны оставаться прямыми двойными кавычками."}], "mini": "Измените значение «Остаток» отдельным присваиванием и выведите его повторно. Объясните отличие объявления от присваивания.", "source": "М. Г. Радченко, «1С:ЭЛЕМЕНТарно!», гл. 4, с. 23–40. Пояснения и задания адаптированы для практикума.", "project": "Этап 3. Данные товара в переменных"}, {"title": "Типы данных и вычисления", "theory": "«18» — строка, а 18 — число. Числа участвуют в арифметических операциях: +, -, *, /. «Истина» и «Ложь» — логические значения типа «Булево», они пишутся без кавычек. Тип переменной может определяться по начальному значению; объявление «пер» не означает, что значение можно произвольно менять на значение любого типа. Для стоимости используйте числа, для имени — строку.", "code": "метод Скрипт()\n    пер Товар = \"Клавиатура\"\n    пер Цена = 1500\n    пер Количество = 2\n    пер Итого = Цена * Количество\n    Консоль.Записать(\"Товар: ${Товар}\")\n    Консоль.Записать(\"Стоимость: ${Итого} руб.\")\n;", "python": "product = \"Клавиатура\"\nprice = 1500\nquantity = 2\ntotal = price * quantity\nprint(f\"Товар: {product}\")\nprint(f\"Стоимость: {total} руб.\")", "task": "Продолжите программу магазина. Верните товар «Клавиатура», цену 1500 и остаток 12. Добавьте количество 2 и скидку 200 руб. на весь заказ. Вычислите стоимость до скидки, сумму к оплате и остаток после продажи. Выведите расчёт с подписями. На этом этапе считаем, что количество не превышает остаток, а скидка не превышает стоимость заказа.", "expected": "Стоимость: 3000 руб.\nСкидка: 200 руб.\nК оплате: 2800 руб.\nОстаток после продажи: 10 шт.", "hint": "Для суммы к оплате вычтите скидку из стоимости всего заказа. Для остатка вычтите количество проданных единиц из исходного остатка.", "check": "Как записать числовое значение цены?", "options": ["пер Цена = «1500»", "пер Цена = 1500", "пер Цена = «Цена»"], "answer": 1, "explain": "«Число» записываем без кавычек; значение в кавычках будет строкой.", "sections": [{"title": "Статическая типизация", "text": "В 1С:Элемент действует статическая типизация. В «пер Цена = 1500» тип «Число» определяется по начальному значению; в переменную этого типа нельзя записать текст. Артикул храните строкой: даже если он состоит из цифр, над ним не выполняют арифметику. Для цены, количества и остатка нужны числа."}, {"title": "Выражения и скобки", "text": "Выражение даёт значение: «Цена * Количество» — выражение из двух переменных и операции. Умножение и деление имеют приоритет перед сложением и вычитанием; скобки меняют порядок. Сравните «100 + 50 * 2» и «(100 + 50) * 2». «Истина» и «Ложь» — значения типа «Булево», их пишут без кавычек."}], "mini": "Проверьте заказ без скидки: мышь, цена 800, количество 3, остаток 20. Получатся стоимость 2400, сумма к оплате 2400 и остаток 17.", "source": "М. Г. Радченко, «1С:ЭЛЕМЕНТарно!», гл. 4, с. 23–40. Пояснения и задания адаптированы для практикума.", "project": "Этап 4. Расчёт стоимости заказа"}, {"title": "Ввод текста", "theory": "Продавец должен оформлять заказы для разных покупателей без редактирования программы. Метод «Консоль.СчитатьСтроку()» получает текст из консоли и возвращает его в переменную. После подсказки введите значение и нажмите Enter. Сохраняйте ранее добавленные вычисления, заменяя фиксированные текстовые данные вводом.", "code": "метод Скрипт()\n    пер Покупатель = Консоль.СчитатьСтроку(\"Покупатель: \")\n    пер Товар = Консоль.СчитатьСтроку(\"Товар: \")\n    Консоль.Записать(\"Покупатель: ${Покупатель}\")\n    Консоль.Записать(\"Товар: ${Товар}\")\n;", "python": "customer = input(\"Покупатель: \")\nproduct = input(\"Товар: \")\nprint(f\"Покупатель: {customer}\")\nprint(f\"Товар: {product}\")", "task": "В скрипте магазина добавьте ввод имени покупателя, артикула и названия товара. Включите эти сведения в итог заказа. Пока сохраните цену, количество и скидку из предыдущего этапа. Проверьте два запуска с разными покупателями. Для учебной проверки используйте вымышленные данные.", "expected": "Покупатель: Иван\nАртикул: KB-101\nТовар: Клавиатура\nК оплате: 2800 руб.", "hint": "Каждое текстовое поле считайте отдельным вызовом «Консоль.СчитатьСтроку()». В выводе используйте полученные переменные вместе с уже вычисленной суммой.", "check": "Программа ждёт после подсказки «Покупатель:». Что делать?", "options": ["Ввести имя в консоли и нажать Enter", "Удалить определение метода", "Закрыть редактор"], "answer": 0, "explain": "Метод считывания ждёт ответ пользователя в консоли.", "sections": [{"title": "Ввод — отдельный шаг алгоритма", "text": "Разделяйте подсказку ввода и результат вызова. Подсказка сообщает продавцу, что ввести; результат сохраняется в переменную и используется при формировании заказа. Название товара пока вводится вручную: поиск по настоящему каталогу появится при дальнейшем развитии приложения."}, {"title": "Почему число в тексте ещё не число", "text": "Метод «Консоль.СчитатьСтроку()» возвращает текст: введённые цифры ещё не становятся числом для расчёта. Для цены и количества используйте числовой ввод следующего этапа. Артикул, даже состоящий из цифр, оставляйте строкой."}], "mini": "Добавьте ввод способа получения: «Самовывоз» или «Доставка». Выведите введённый текст в заказе. Пока способ получения не влияет на цену.", "source": "Ввод и вывод: официальное руководство «Язык 1С:Элемент», разделы «Ввод и вывод данных» и «Консоль». Переменные и выражения: М. Г. Радченко, «1С:ЭЛЕМЕНТарно!», гл. 4. Задания адаптированы для практикума.", "project": "Этап 5. Данные покупателя и заказа"}, {"title": "Ввод чисел и расчёт покупки", "theory": "«СчитатьЧисло()» получает числовое значение, которое сразу можно использовать в вычислении. В Python «input()» возвращает строку и для арифметики обычно требуется преобразование «int()» или «float()». Сначала считайте исходные данные, затем вычислите итог и только после этого выведите результат. Формат дробных чисел при вводе зависит от локали консоли.", "code": "метод Скрипт()\n    пер Товар = Консоль.СчитатьСтроку(\"Товар: \")\n    пер Цена = Консоль.СчитатьЧисло(\"Цена: \")\n    пер Количество = Консоль.СчитатьЧисло(\"Количество: \")\n    пер Стоимость = Цена * Количество\n    Консоль.Записать(\"Товар: ${Товар}\")\n    Консоль.Записать(\"Стоимость: ${Стоимость} руб.\")\n;", "python": "product = input(\"Товар: \")\nprice = float(input(\"Цена: \"))\nquantity = float(input(\"Количество: \"))\ntotal = price * quantity\nprint(f\"Товар: {product}\")\nprint(f\"Стоимость: {total} руб.\")", "task": "Замените фиксированные цену, количество, скидку и исходный остаток числовым вводом. Сохраните ввод покупателя и товара. Рассчитайте стоимость, сумму к оплате и остаток после продажи. Выведите сводку заказа с исходными данными и результатами. Для проверки вводите неотрицательные значения, количество не больше остатка, скидку не больше стоимости; автоматическая проверка этих условий пока не требуется.", "expected": "Покупатель: Иван\nТовар: Клавиатура\nЦена: 1500 руб.\nКоличество: 2 шт.\nСтоимость: 3000 руб.\nСкидка: 200 руб.\nК оплате: 2800 руб.\nОстаток после продажи: 10 шт.", "hint": "Не объявляйте повторно переменные из прежней версии: замените их начальные значения вызовами ввода. Разделите программу на ввод, вычисление и вывод с помощью комментариев.", "check": "Как получить значение для арифметического расчёта?", "options": ["Консоль.Записать(«Цена»)", "Консоль.СчитатьЧисло(«Цена: »)", "Консоль.СчитатьСтроку(«Цена: ») без преобразования"], "answer": 1, "explain": "«СчитатьЧисло()» возвращает число для дальнейших вычислений.", "sections": [{"title": "Ввод → обработка → вывод", "text": "Сначала получите текстовые и числовые данные. Затем выполните расчёты и только после этого сформируйте сводку. Формулы: стоимость = цена × количество; к оплате = стоимость − скидка; новый остаток = исходный остаток − количество. Скидка задаётся в рублях на весь заказ, а не на единицу товара."}, {"title": "Проверка на разных данных", "text": "Один удачный запуск ещё не подтверждает формулу. Проверьте покупку из нескольких единиц, одну единицу и нулевое количество. Ожидаемый итог посчитайте заранее. В рамках упражнения вводите корректные неотрицательные числа; проверку неправильного ввода изучим отдельно."}], "mini": "Проверьте мышь: цена 800, количество 3, скидка 0, остаток 20. Затем нулевое количество при нулевой скидке: к оплате 0, исходный остаток не изменится.", "source": "Ввод и вывод: официальное руководство «Язык 1С:Элемент», разделы «Ввод и вывод данных» и «Консоль». Переменные и выражения: М. Г. Радченко, «1С:ЭЛЕМЕНТарно!», гл. 4. Задания адаптированы для практикума.", "project": "Этап 6. Оформление одного заказа"}, {"title": "Несколько заказов", "theory": "Завершим учебный прототип: продавцу нужно увидеть суммы двух отдельных заказов и общий итог. Используйте изученные ввод, переменные, арифметику и вывод. Пока каждый заказ содержит одну товарную позицию. Циклы ещё не изучались, поэтому два блока обработки запишем последовательно. В следующем занятии повторяющуюся логику можно будет вынести в метод и цикл.", "code": "// План развития того же скрипта:\n// 1. Получить данные первого заказа\n// 2. Рассчитать и сохранить сумму к оплате\n// 3. Получить данные второго заказа\n// 4. Рассчитать и сохранить его сумму\n// 5. Вычислить общую сумму двух заказов\n// 6. Вывести сводку продавца", "python": "# План развития того же скрипта:\n# 1. Получить данные первого заказа\n# 2. Рассчитать и сохранить сумму к оплате\n# 3. Получить данные второго заказа\n# 4. Рассчитать и сохранить его сумму\n# 5. Вычислить общую сумму двух заказов\n# 6. Вывести сводку продавца", "task": "Доработайте тот же скрипт для двух независимых заказов. Для каждого получите покупателя, товар, цену, количество и скидку на весь заказ. Рассчитайте две суммы к оплате и их общий итог. Сохраните суммы в разных переменных, чтобы второй расчёт не затёр первый. В конце выведите покупателя, товар и сумму каждого заказа, количество заказов и общий итог. Здесь под итогом понимаем сумму заказов, а не прибыль магазина. Складские остатки из предыдущей версии сохраните, но в этом этапе не связывайте их между заказами.", "expected": "Заказ 1: Иван — Клавиатура — 2800 руб.\nЗаказ 2: Анна — Мышь — 2400 руб.\nЗаказов: 2\nОбщий итог: 5200 руб.", "hint": "Сначала отдельно проверьте каждый заказ. Для расчёта общего итога сложите сохранённые суммы к оплате. Контрольные данные: заказ 1 — 1500 × 2 − 200; заказ 2 — 800 × 3 − 0.", "check": "Как найти общий итог двух заказов после скидок?", "options": ["Сложить цены единицы товара", "Сложить суммы к оплате по обоим заказам", "Умножить суммы заказов друг на друга"], "answer": 1, "explain": "Каждая сумма к оплате уже учитывает количество и скидку своего заказа. Общий итог — их сумма.", "sections": [{"title": "От одной операции к бизнес-процессу", "text": "Оформление заказа связывает покупателя, товар, количество, цену и скидку. Сводка объединяет результаты нескольких таких операций. Названия переменных должны показывать, какому заказу принадлежит значение: например, «СуммаПервогоЗаказа» и «СуммаВторогоЗаказа»."}, {"title": "Проверка результата проекта", "text": "Перед запуском посчитайте ожидаемые суммы вручную. Если общий итог неверен, сначала проверьте каждый заказ отдельно. Сохраните версии скрипта после этапов: они покажут, как одна программа развивалась от вывода текста до обработки заказов."}], "mini": "Проверьте два заказа без скидок: монитор 12000 × 1 и кабель 500 × 2. Общий итог должен быть 13000. Объясните, что потребуется изменить, если число заказов станет произвольным.", "source": "М. Г. Радченко, «1С:ЭЛЕМЕНТарно!», гл. 4, с. 20–43. Пояснения и задания адаптированы для практикума.", "project": "Этап 7. Сводка по двум заказам"}, {"title": "Тестирование"}];

'use strict';const $=s=>document.querySelector(s);const key='elementShopCourseV1';let state={};let storage=true;try{const x=JSON.parse(localStorage.getItem(key)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))state=x}catch{storage=false}let current=Number.isInteger(state.current)&&state.current>=0&&state.current<lessons.length?state.current:0;function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{storage=false}if(!storage)console.warn('Сохранение прогресса в браузере недоступно.')}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(i,scroll=false){current=i;state.current=i;save();nav();let l=lessons[i];if(i===8){renderQuiz();if(scroll)window.scrollTo({top:0,behavior:'smooth'});return}let passed=state['passed'+i]===true;$('#lesson').innerHTML=`<span class="step-tag">ШАГ ${i+1} / ${lessons.length}</span><h1 tabindex="-1" id="lessonTitle">${esc(l.title)}</h1><div class="learn-block"><h3>1. Теория</h3>${l.theory.split('\n\n').map(t=>`<p>${esc(t)}</p>`).join('')}${l.sections.map(x=>`${x.headingLevel===3?`<h3>${esc(x.title)}</h3>`:`<h4>${esc(x.title)}</h4>`}<p>${esc(x.text)}</p>${x.links?`<div class="case-links">${x.links.map(y=>`<a href="${esc(y.url)}" target="_blank" rel="noopener noreferrer">${esc(y.label)} ↗</a>`).join('')}</div>`:''}`).join('')}</div>${i===0?`<div class="setup-links"><a class="button secondary-link" href="https://lang.1c.ru/" target="_blank" rel="noopener noreferrer">Сайт языка и дистрибутив ↗</a><a class="button" href="https://1cmycloud.com/console/play" target="_blank" rel="noopener noreferrer">Среда в браузере ↗</a></div><p class="note">Подготовьте среду и переходите к каркасу программы. Практические задания начнутся на следующем шаге.</p>`:`<div class="learn-block"><h3>2. Один алгоритм — два языка</h3><p class="small muted">Пример показывает конструкцию текущего этапа. Встройте её в свой скрипт магазина, сохраняя предыдущие возможности. Определение «метод Скрипт()» должно остаться одно.</p><div class="editor code-window"><div class="code-tabs" role="tablist" aria-label="Язык примера"><button role="tab" id="tab-script" aria-selected="true" aria-controls="code-panel" data-lang="script">1С:Элемент Скрипт</button><button role="tab" id="tab-python" aria-selected="false" aria-controls="code-panel" tabindex="-1" data-lang="python">Python</button></div><pre id="code-panel" role="tabpanel" aria-labelledby="tab-script" tabindex="0">${esc(l.code)}</pre></div></div><section class="practice-work" aria-label="Практическое задание"><div class="practice-heading"><div><h3>3. Попробуйте самостоятельно</h3></div></div><p class="project-stage">${esc(l.project)}</p><p class="practice-brief">${esc(l.task)}</p><ol class="work-steps"><li><b>Напишите</b><span>Перенесите алгоритм в редактор 1С.</span></li><li><b>Запустите</b><span>Прочитайте вывод или сообщение об ошибке.</span></li><li><b>Сравните</b><span>Проверьте ответ и измените исходные данные.</span></li></ol><div class="practice-details"><details><summary>Какой результат получить?</summary><pre class="expected">${esc(l.expected)}</pre></details>${l.hint?`<details><summary>Подсказка к решению</summary><p>${esc(l.hint)}</p></details>`:''}<details><summary>Дополнительное задание</summary><p>${esc(l.mini)}</p></details></div></section><div class="completion"><h3>4. Проверьте себя</h3><div id="check"><fieldset class="quiz-question"><legend>${esc(l.check)}</legend>${l.options.map((o,j)=>`<label><input type="radio" name="answer" value="${j}" ${state['answer'+i]===j?'checked':''}>${esc(o)}</label>`).join('')}</fieldset><button type="button" id="checkAnswer">Проверить ответ</button><p id="feedback" class="feedback" aria-live="polite">${passed?'Верно. '+esc(l.explain):''}</p></div><label class="checkline"><input type="checkbox" id="ran" ${state['ran'+i]?'checked':''}>Я выполнил практику в среде и проверил результат</label><p class="small muted">Выберите ответ и нажмите «Проверить ответ». После верного ответа отметьте выполнение практики и нажмите «Завершить шаг».</p><button id="complete">${state['done'+i]?'Шаг завершён ✓':'Завершить шаг'}</button><p id="completeStatus" aria-live="polite" class="status"></p></div>`}<div class="lesson-bottom"><button class="secondary" id="prev" ${i===0?'disabled':''}>← Предыдущий шаг</button><button id="next">${i===lessons.length-1?'Вернуться к началу ↑':'Следующий шаг →'}</button></div>`;
if(i>0){const langButtons=[...document.querySelectorAll('[data-lang]')];function switchLang(lang){langButtons.forEach(b=>{let on=b.dataset.lang===lang;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});$('#code-panel').textContent=lang==='python'?l.python:l.code;$('#code-panel').setAttribute('aria-labelledby','tab-'+lang)}langButtons.forEach((b,j)=>{b.onclick=()=>switchLang(b.dataset.lang);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();let t=e.key==='Home'?langButtons[0]:e.key==='End'?langButtons[1]:langButtons[1-j];t.focus();switchLang(t.dataset.lang)}}});$('#checkAnswer').onclick=()=>{let a=$('#check input[name=answer]:checked');if(!a){$('#feedback').textContent='Выберите ответ.';return}let good=+a.value===l.answer;state['passed'+i]=good;$('#feedback').dataset.result=good?'correct':'wrong';$('#feedback').textContent=good?'Верно. '+l.explain:'Пока неверно. Перечитайте объяснение и попробуйте ещё раз.';save();$('#feedback').scrollIntoView({block:'nearest',behavior:'smooth'})};document.querySelectorAll('input[name=answer]').forEach(r=>r.onchange=()=>{state['answer'+i]=+r.value;state['passed'+i]=false;state['done'+i]=false;$('#feedback').textContent='';delete $('#feedback').dataset.result;$('#complete').textContent='Завершить шаг';save();nav()});$('#ran').onchange=e=>{state['ran'+i]=e.target.checked;if(!e.target.checked){state['done'+i]=false;$('#complete').textContent='Завершить шаг'}save();nav()};$('#complete').onclick=()=>{if(!state['ran'+i]||!state['passed'+i]){$('#completeStatus').textContent='Отметьте выполнение в среде и правильно ответьте на вопрос.';return}state['done'+i]=true;save();nav();$('#complete').textContent='Шаг завершён ✓';$('#completeStatus').textContent='Отлично, переходите дальше.'};}$('#prev').onclick=()=>render(i-1,true);$('#next').onclick=()=>{if(i===0){state.done0=true;save()}render(i===lessons.length-1?0:i+1,true)};if(scroll){$('#lessonTitle').focus({preventScroll:true});$('#lesson').scrollIntoView({behavior:'smooth',block:'start'})}}
render(current);
</script></body></html>
