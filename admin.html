<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Результаты · 1С:Элемент</title>
<style>
:root{--red:#bd262a;--dark:#51191c;--line:#e9ded3}*{box-sizing:border-box}body{margin:0;color:#302724;background:#fffaf2;font:16px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px 24px}a{color:var(--red)}h1{line-height:1.2;letter-spacing:-1px}button,input,select{font:inherit}button{cursor:pointer;background:var(--red);color:white;border:0;border-radius:9px;padding:10px 16px;font-weight:650}button:disabled{opacity:.5;cursor:wait}input,select{padding:10px;border:1px solid #cfbfb0;border-radius:8px;max-width:100%}label{display:grid;gap:5px;margin:14px 0}#login{max-width:460px;background:white;padding:28px;border:1px solid var(--line);border-radius:16px;margin:35px 0}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.bar label{margin:0}.muted{color:#766b66;font-size:14px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--red)}[hidden]{display:none!important}#message{white-space:pre-line}#details{margin-top:24px}li{margin:15px 0}.good{color:#20643d}.bad{color:#bd262a}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1668ae;outline-offset:3px}
</style><link rel="icon" type="image/svg+xml" href="favicon.svg?v=1"></head><body><main><a href="index.html">← К практикуму</a><h1>Результаты тестирования</h1><p class="muted">Кабинет преподавателя · Тема 1. От Python к Элементу</p><p id="message" role="status" aria-live="polite"></p>
<form id="login"><h2>Вход преподавателя</h2><label>Электронная почта<input name="email" type="email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form>
<div id="dashboard" hidden><div class="bar"><button id="refresh">Обновить</button><button id="csv">Скачать CSV</button><button id="logout">Выйти</button></div><div class="bar"><label>Поиск по ФИО<input id="search" placeholder="Фамилия или имя"></label><label>Группа<select id="group"><option value="">Все группы</option></select></label><label>Статус<select id="status"><option value="">Все попытки</option><option value="done">Завершённые</option><option value="started">Начатые</option></select></label></div><p id="summary"></p><div class="panel table-wrap"><table><thead><tr><th>ФИО</th><th>Группа</th><th>Начало</th><th>Длительность</th><th>Балл</th><th>Оценка</th><th>Статус</th><th>Ответы</th></tr></thead><tbody id="rows"></tbody></table></div><div class="bar"><button id="prevPage">← Назад</button><span id="page"></span><button id="nextPage">Далее →</button></div><section id="details" class="panel" hidden></section></div></main>
<script src="config.js"></script><script src="api.js"></script><script src="questions.js"></script><script src="admin.js"></script></body></html>
